<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dela Cruz Store Inventory Management System</title>
    
    <style>
        body { font-family: Arial, sans-serif; background: #001e46; color: white; margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 100vh; }
        .container { width: 100%; max-width: 900px; background: rgba(0, 20, 50, 0.9); padding: 25px; border-radius: 10px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        h1, h2 { text-align: center; }
        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-size: 14px; }
        input, select { width: 100%; padding: 10px; border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 6px; background: rgba(255, 255, 255, 0.1); color: white; box-sizing: border-box; }
        button { width: 100%; padding: 10px; background-color: #004080; color: white; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; margin-top: 10px; }
        button:hover { background-color: #002b5c; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th, td { border: 1px solid rgba(255,255,255,0.2); padding: 8px; text-align: left; }
        th { background: rgba(0, 64, 128, 0.8); }
        .hidden { display: none !important; }
        .alert { padding: 10px; margin-top: 10px; text-align: center; border-radius: 5px; }
        .success { background: rgba(0, 128, 0, 0.4); }
        .error { background: rgba(128, 0, 0, 0.4); }
    </style>
</head>
<body>

<div class="container">
    <h1>🛒 DELA CRUZ STORE INVENTORY SYSTEM</h1>
    <hr>

    <!-- LOGIN / REGISTER VIEW -->
    <div id="authSection">
        <div id="loginView">
            <h2>USER LOGIN</h2>
            <div class="form-group"><label>Username</label><input type="text" id="loginUser"></div>
            <div class="form-group"><label>Password</label><input type="password" id="loginPass"></div>
            <button onclick="handleLogin()">LOGIN</button>
            <button onclick="switchView('registerView')" style="background: #002b5c;">Create Account</button>
            <div id="loginAlert"></div>
        </div>

        <div id="registerView" class="hidden">
            <h2>CREATE ACCOUNT</h2>
            <div class="form-group"><label>Full Name</label><input type="text" id="regFullname"></div>
            <div class="form-group"><label>Username</label><input type="text" id="regUser"></div>
            <div class="form-group"><label>Password</label><input type="password" id="regPass"></div>
            <div class="form-group"><label>Email</label><input type="email" id="regEmail"></div>
            <button onclick="handleRegister()">Submit Registration</button>
            <button onclick="switchView('loginView')" style="background: #555;">Back to Login</button>
            <div id="regAlert"></div>
        </div>
    </div>

    <!-- DASHBOARD / ADMIN VIEW -->
    <div id="appSection" class="hidden">
        <h3 id="welcomeMsg">Welcome</h3>
        <button onclick="handleLogout()" style="background: #a94442; width: auto; padding: 5px 15px;">Logout</button>
        <hr>

        <div id="adminPanel" class="hidden">
            <h2>Admin Panel: Pending Accounts</h2>
            <table>
                <thead><tr><th>Full Name</th><th>Username</th><th>Email</th><th>Action</th></tr></thead>
                <tbody id="pendingTableBody"><tr><td colspan="4" style="text-align:center;">No pending accounts.</td></tr></tbody>
            </table>
        </div>

        <div id="staffPanel" class="hidden">
            <h2>Staff Portal</h2>
            <p>Your account is active. Waiting for admin approval.</p>
        </div>
    </div>
</div>

<!-- FIREBASE SDK & APP LOGIC -->
<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, onValue } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA6AxuCzAs1TePvX43-cBBfe_H6_35d53A",
      authDomain: "delacruztore.firebaseapp.com",
      databaseURL: "https://delacruztore-default-rtdb.firebaseio.com",
      projectId: "delacruztore",
      storageBucket: "delacruztore.firebasestorage.app",
      messagingSenderId: "105395830230",
      appId: "1:105395830230:web:ad0f5e4be903676c91f877",
      measurementId: "G-LCGJ04G9L1"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const dbRef = ref(db);
    get(child(dbRef, 'users')).then((snapshot) => {
        if (!snapshot.exists()) {
            set(ref(db, 'users'), [
                { fullname: "Nomer Bueno", username: "Engr.NBueno", password: "ownerpassword", email: "EngineernBueno@gmail.com", status: "approved", role: "owner" },
                { fullname: "virgilio isla", username: "ilyong123", password: "adminpassword", email: "ilyong.isla.7@gmail.com", status: "approved", role: "admin" }
            ]);
        }
    });

    let cloudUsers = [];
    
    onValue(ref(db, 'users'), (snapshot) => {
        cloudUsers = snapshot.val() || [];
        renderAdminApprovals();
        
        // Check if there's a saved session in localStorage so refreshing won't log out
        checkActiveSession();
    });

    window.switchView = function(viewId) {
        document.getElementById('loginView').classList.add('hidden');
        document.getElementById('registerView').classList.add('hidden');
        document.getElementById(viewId).classList.remove('hidden');
    }

    window.handleRegister = function() {
        const fullname = document.getElementById('regFullname').value;
        const username = document.getElementById('regUser').value;
        const password = document.getElementById('regPass').value;
        const email = document.getElementById('regEmail').value;
        
        if(!fullname || !username || !password || !email) {
            showAlert('regAlert', 'Please fill all fields.', false);
            return;
        }

        if(cloudUsers.some(u => u.username === username)) {
            showAlert('regAlert', 'Username already exists.', false);
            return;
        }

        cloudUsers.push({ fullname, username, password, email, status: 'pending', role: 'associate' });
        set(ref(db, 'users'), cloudUsers).then(() => {
            showAlert('regAlert', 'Registered successfully! Wait for admin approval.', true);
            setTimeout(() => switchView('loginView'), 2000);
        });
    }

    window.handleLogin = function() {
        const username = document.getElementById('loginUser').value;
        const password = document.getElementById('loginPass').value;

        const user = cloudUsers.find(u => u.username === username && u.password === password);
        if(!user) {
            showAlert('loginAlert', 'Invalid username or password.', false);
            return;
        }
        if(user.status === 'pending') {
            showAlert('loginAlert', 'Your account is still pending approval.', false);
            return;
        }

        // Save session locally so reload won't log out
        localStorage.setItem('activeUser', JSON.stringify(user));
        setUIVisible(user);
    }

    function checkActiveSession() {
        const savedUser = localStorage.getItem('activeUser');
        if (savedUser && cloudUsers.length > 0) {
            const parsedUser = JSON.parse(savedUser);
            // Verify if user still exists and is approved in cloud
            const latestUser = cloudUsers.find(u => u.username === parsedUser.username && u.status === 'approved');
            if (latestUser) {
                setUIVisible(latestUser);
            } else {
                localStorage.removeItem('activeUser');
            }
        }
    }

    function setUIVisible(user) {
        document.getElementById('authSection').classList.add('hidden');
        document.getElementById('appSection').classList.remove('hidden');
        document.getElementById('welcomeMsg').textContent = `Welcome, ${user.fullname} (${user.role.toUpperCase()})`;

        if(user.role === 'owner' || user.role === 'admin') {
            document.getElementById('adminPanel').classList.remove('hidden');
            renderAdminApprovals();
        } else {
            document.getElementById('staffPanel').classList.remove('hidden');
        }
    }

    function renderAdminApprovals() {
        const tbody = document.getElementById('pendingTableBody');
        if(!tbody) return;
        tbody.innerHTML = '';
        const pending = cloudUsers.filter(u => u.status === 'pending');
        if(pending.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" style="text-align:center;">No pending accounts.</td></tr>`;
            return;
        }
        pending.forEach((u) => {
            const index = cloudUsers.findIndex(item => item.username === u.username);
            tbody.innerHTML += `<tr><td>${u.fullname}</td><td>${u.username}</td><td>${u.email}</td><td><button onclick="approveUser(${index})" style="padding: 5px; width:auto; background:#28a745;">Approve</button></td></tr>`;
        });
    }

    window.approveUser = function(index) {
        cloudUsers[index].status = 'approved';
        set(ref(db, 'users'), cloudUsers).then(() => {
            alert('Account approved successfully!');
        });
    }

    window.handleLogout = function() {
        localStorage.removeItem('activeUser'); // Clear saved session on explicit logout
        document.getElementById('appSection').classList.add('hidden');
        document.getElementById('authSection').classList.remove('hidden');
        document.getElementById('adminPanel').classList.add('hidden');
        document.getElementById('staffPanel').classList.add('hidden');
    }

    function showAlert(elementId, msg, isSuccess) {
        const el = document.getElementById(elementId);
        el.className = `alert ${isSuccess ? 'success' : 'error'}`;
        el.textContent = msg;
        setTimeout(() => el.textContent = '', 4000);
    }
</script>

</body>
</html>
